# =============================================================================
# Coturn TURN/STUN Configuration — ISL Real-Time Communication Platform
# RFC 5766 (TURN), RFC 5389 (STUN), RFC 6156 (IPv6 TURN), draft-uberti-behave-turn-rest-00
# =============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Min and max ports for UDP relay allocations
min-port=49152
max-port=49200

# Realm for authentication
realm=missingwhisper.local

# Ephemeral short-TTL REST credential mechanism (HMAC-SHA1)
use-auth-secret
static-auth-secret=coturn-shared-secret-change-in-production

# Fingerprint attribute in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Quotas and nonces
total-quota=100
bps-capacity=0
stale-nonce=600

# Security: prevent relay loopback into internal networks
no-loopback-peers
no-multicast-peers

verbose
